<section class="register-page">
  <form class="register-card" (ngSubmit)="register()">
    <a routerLink="/welcome" class="back-link"> ← Volver </a>
    <h1>Crear cuenta</h1>

    <p class="subtitle">
      Únete a Astralium y empieza a ganar puntos estelares.
    </p>

    <label for="username">Usuario</label>
    <input
      id="username"
      type="text"
      name="username"
      [(ngModel)]="username"
      required
    />

    <label for="email">Email</label>
    <input id="email" type="email" name="email" [(ngModel)]="email" required />

    <label for="password">Contraseña</label>
    <input
      id="password"
      type="password"
      name="password"
      [(ngModel)]="password"
      required
    />

    <p class="error" *ngIf="errorMessage">
      {{ errorMessage }}
    </p>

    <p class="success" *ngIf="successMessage">
      {{ successMessage }}
    </p>

    <button type="submit" [disabled]="isLoading">
      {{ isLoading ? "Creando cuenta..." : "Registrarme" }}
    </button>

    <p class="login-link">
      ¿Ya tienes cuenta?
      <a routerLink="/login">Inicia sesión</a>
    </p>
  </form>
</section>
